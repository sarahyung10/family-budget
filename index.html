<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<title>家庭記帳</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');
:root {
  --bg:#F4F6FB;
  --card:#FFFFFF;
  --border:#E4E8F4;
  --dark:#1A1F36;
  --mid:#5A6080;
  --light:#8A90B0;
  --muted:#A8AECA;
  --pale:#CDD2E8;
  --primary:#6C63FF;
  --primary-2:#9B8FFF;
  --primary-light:#F0EEFF;
  --primary-dark:#5A52E0;
  --accent:#4FA8E8;
  --green:#3DAA72;
  --green-light:#E8F7EF;
  --red:#E8504A;
  --user-me:#6C63FF;
  --user-hu:#4FA8E8;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 2px 12px rgba(108,99,255,.08);
  --shadow-md:0 6px 24px rgba(108,99,255,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC','PingFang TC','Helvetica Neue',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;min-height:-webkit-fill-available;overscroll-behavior:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--pale);border-radius:2px}

/* Header */
#header{background:#fff;color:var(--dark);padding:52px 20px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 0 var(--border),0 2px 16px rgba(108,99,255,.07)}
.header-title{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-last{font-size:10px;color:var(--muted);margin-top:2px}
.month-nav{display:flex;align-items:center;background:var(--bg);border-radius:20px;padding:2px 4px}
.arr{cursor:pointer;user-select:none;padding:4px 10px;opacity:.5;font-size:20px;line-height:1;transition:opacity .2s;color:var(--primary)}
.arr:hover,.arr:active{opacity:1}
#month-label{font-size:13px;font-weight:600;min-width:44px;text-align:center;color:var(--dark)}
.btn-add{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:none;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;box-shadow:0 2px 10px rgba(108,99,255,.35)}
.btn-add.cancel{background:#f0f0f4;color:var(--mid);box-shadow:none}
.btn-add:active{transform:scale(.96)}

/* Main */
#main{max-width:480px;margin:0 auto;padding-bottom:80px}

/* Total card */
#total-card{background:linear-gradient(135deg,var(--primary) 0%,var(--accent) 100%);color:#fff;border-radius:var(--radius);padding:22px 22px 20px;margin:16px 16px 0;box-shadow:var(--shadow-md)}
#total-card .lbl{font-size:11px;font-weight:500;opacity:.75;margin-bottom:8px;letter-spacing:.5px}
#total-amount{font-size:34px;font-weight:700}

/* Chart card */
.card{margin:12px 16px 0;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 16px;border:none}
.card-label{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:12px;letter-spacing:.5px}
#chart-wrap{position:relative;width:180px;height:180px;margin:0 auto}
#chart-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-name{font-size:12px;color:var(--mid);font-weight:500}
.legend-val{font-size:12px;color:var(--muted)}
.empty-chart{padding:36px 0;text-align:center;color:var(--muted);font-size:13px}

/* Records */
#records-list{margin:12px 16px 0}
.list-header{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:10px;letter-spacing:.5px}
.hint{font-size:9px;opacity:.6;margin-left:6px;font-weight:400}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:32px 0}

/* Swipe row */
.swipe-outer{position:relative;overflow:hidden;margin-bottom:6px;border-radius:var(--radius-sm)}
.swipe-actions{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:stretch}
.swipe-btn{width:72px;border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.swipe-btn.edit{background:var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.swipe-btn.delete{background:var(--red);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.swipe-inner{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);border-radius:var(--radius-sm);position:relative;z-index:1;transition:transform .25s ease;touch-action:pan-y;will-change:transform;box-shadow:var(--shadow)}

/* Record icon */
.rec-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.rec-info{flex:1;min-width:0}
.rec-cat{font-size:14px;color:var(--dark);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rec-note-small{font-size:11px;color:var(--muted);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-meta{font-size:10px;color:var(--pale);display:flex;align-items:center;gap:4px}
.rec-user{font-size:11px;font-weight:600;border-radius:8px;padding:2px 8px;flex-shrink:0}
.rec-amount{font-size:15px;font-weight:700;color:var(--dark);flex-shrink:0;min-width:56px;text-align:right}
.rec-amount.income{color:var(--green)}

/* Form */
#form-wrap{margin:16px 16px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 18px;animation:fadeIn .2s ease}
.form-title{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:18px;letter-spacing:.5px}
.field{margin-bottom:16px}
.field-label{font-size:11px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;user-select:none}
.field-link{font-size:11px;color:var(--primary);font-weight:600;cursor:pointer}
.btn-row{display:flex;gap:8px}

/* Toggle buttons */
.toggle-btn{flex:1;padding:10px 0;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.toggle-btn.active-green{border-color:var(--user-me);background:var(--user-me);color:#fff;box-shadow:0 2px 10px rgba(108,99,255,.3)}
.toggle-btn.active-green svg *{stroke:#fff}
.toggle-btn.active-brown{border-color:var(--user-hu);background:var(--user-hu);color:#fff;box-shadow:0 2px 10px rgba(79,168,232,.3)}
.toggle-btn.active-brown svg *{stroke:#fff}
.toggle-btn.active-blue{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.toggle-btn.active-blue svg *{stroke:var(--primary)}

/* Category chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cat-chip-wrap{display:flex}
.cat-main-btn{padding:7px 8px 7px 10px;border-radius:20px 0 0 20px;border:1.5px solid var(--border);border-right:none;background:transparent;color:var(--muted);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.cat-edit-btn{padding:7px 8px;border-radius:0 20px 20px 0;border:1.5px solid var(--border);background:transparent;color:var(--pale);font-family:inherit;font-size:11px;cursor:pointer;transition:all .15s;display:flex;align-items:center}
.cat-main-btn:active,.cat-edit-btn:active{opacity:.7}

/* Sub chips */
.sub-chip{padding:6px 14px;border-radius:16px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}

input[type=text],input[type=number],input[type=date]{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);font-family:inherit;font-size:14px;color:var(--dark);-webkit-appearance:none;appearance:none}
input[type=number]{font-size:24px;font-weight:700}
input:focus{outline:none;border-color:var(--primary);background:#fff}

.btn-save{width:100%;padding:14px 0;border:none;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;box-shadow:0 3px 14px rgba(108,99,255,.35)}
.btn-save.saved{background:linear-gradient(135deg,var(--green),#5DC98A);box-shadow:0 3px 12px rgba(61,170,114,.3)}
.btn-save:active{transform:scale(.98)}

/* Manage / EditCat */
#manage-wrap,#editcat-wrap{margin:16px 16px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 18px;animation:fadeIn .2s ease}
.panel-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.panel-sub{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.5px}
.panel-name{font-size:16px;font-weight:700}
.sub-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;min-height:36px}
.sub-tag{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 12px;border-radius:16px;font-size:12px;font-weight:500}
.sub-tag-del{color:var(--pale);cursor:pointer;font-size:15px;line-height:1;background:none;border:none;font-family:inherit;transition:color .15s}
.sub-tag-del:hover{color:var(--primary)}
.input-row{display:flex;gap:8px;margin-bottom:16px}
.input-row input{flex:1;font-size:13px}
.btn-small{padding:10px 16px;border:none;border-radius:var(--radius-sm);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-back{width:100%;padding:12px 0;background:transparent;color:var(--muted);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer}

/* Icon / Color picker */
.icon-grid{display:flex;flex-wrap:wrap;gap:8px}
.icon-opt{width:46px;height:46px;border-radius:12px;cursor:pointer;transition:all .15s;background:var(--bg);border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:22px}
.icon-opt:hover{background:var(--primary-light)}
.icon-opt.sel{background:var(--primary-light);border-color:var(--primary)}
.color-grid{display:flex;flex-wrap:wrap;gap:10px}
.color-opt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.color-opt:hover{transform:scale(1.15)}
.color-opt.sel{border-color:var(--dark)}
.editcat-btns{display:flex;gap:10px;margin-top:8px}
.btn-danger{padding:12px 16px;background:transparent;color:var(--red);border:1.5px solid var(--red);border-radius:var(--radius-sm);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary{flex:1;padding:12px 0;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 10px rgba(108,99,255,.3)}

/* Tab */
.tab-bar{display:flex;margin:12px 16px 0;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;padding:4px;gap:4px}
.tab-btn{flex:1;padding:10px 0;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s;border-radius:12px}
.tab-btn.active-exp{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 2px 10px rgba(108,99,255,.3)}
.tab-btn.active-inc{background:linear-gradient(135deg,var(--green),#5DC98A);color:#fff;box-shadow:0 2px 10px rgba(61,170,114,.3)}

/* Total card 二欄 */
.total-row{display:flex;gap:0;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.total-col{flex:1;text-align:center;position:relative}
.total-col+.total-col::before{content:"";position:absolute;left:0;top:10%;bottom:10%;width:1px;background:rgba(255,255,255,.2)}
.total-col-lbl{font-size:10px;opacity:.7;margin-bottom:4px;font-weight:500}
.total-col-val{font-size:17px;font-weight:700}
.total-col-val.inc{color:#C8F0D8}

/* 記帳類型切換 */
.type-row{display:flex;gap:8px;margin-bottom:16px}
.type-btn{flex:1;padding:10px 0;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.type-btn.active-exp{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.type-btn.active-inc{border-color:var(--green);background:var(--green-light);color:var(--green)}

#loading{text-align:center;padding:60px 0;color:var(--muted);font-size:13px}

@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@supports (padding-top:env(safe-area-inset-top)){
  #header{padding-top:max(52px,calc(env(safe-area-inset-top) + 14px))}
}
</style>
</head>
<body>

<div id="header">
  <div>
    <div class="header-title">Yu家記帳</div>
    <div class="header-last" id="header-last"></div>
  </div>
  <div class="month-nav">
    <span class="arr" onclick="changeMonth(-1)">‹</span>
    <span id="month-label"></span>
    <span class="arr" onclick="changeMonth(1)">›</span>
  </div>
  <button class="btn-add" id="btn-add-top" onclick="toggleAdd()">+ 記帳</button>
</div>

<div id="main">
  <div id="loading">載入中…</div>

  <div id="dashboard" style="display:none">
    <div id="total-card">
      <div class="lbl" id="total-lbl">本月支出</div>
      <div id="total-amount">NT$ 0</div>
      <div class="total-row">
        <div class="total-col">
          <div class="total-col-lbl">收入</div>
          <div class="total-col-val inc" id="total-income">0</div>
        </div>
        <div class="total-col">
          <div class="total-col-lbl">支出</div>
          <div class="total-col-val" id="total-expense">0</div>
        </div>
      </div>
    </div>

    <!-- Tab -->
    <div class="tab-bar">
      <button class="tab-btn active-exp" id="tab-exp" onclick="setTab('expense')">支　出</button>
      <button class="tab-btn" id="tab-inc" onclick="setTab('income')">收　入</button>
    </div>
    <div class="card" id="chart-card" style="display:none">
      <div class="card-label">支出分析</div>
      <div id="chart-wrap"><canvas id="pieChart"></canvas></div>
      <div id="chart-legend"></div>
    </div>
    <div class="card empty-chart" id="chart-empty" style="display:none">本月尚無記錄</div>
    <div id="records-list">
      <div class="list-header">明細記錄<span class="hint">← 左滑可編輯／刪除</span></div>
      <div id="records-inner"></div>
    </div>
  </div>

  <div id="form-wrap" style="display:none">
    <div class="form-title" id="form-title">新增支出</div>

    <!-- 支出 / 收入 切換 -->
    <div class="type-row">
      <button class="type-btn" id="type-exp" onclick="setType('expense')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
        支出
      </button>
      <button class="type-btn" id="type-inc" onclick="setType('income')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        收入
      </button>
    </div>
    <div class="field">
      <div class="field-label">記帳人</div>
      <div class="btn-row">
        <button class="toggle-btn" id="btn-me" onclick="setUser('me')">
          <!-- person icon -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          淯
        </button>
        <button class="toggle-btn" id="btn-husband" onclick="setUser('husband')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          達
        </button>
      </div>
    </div>
    <div class="field">
      <div class="field-label">付款方式</div>
      <div class="btn-row">
        <button class="toggle-btn" id="btn-cash" onclick="setPayment('cash')">
          <!-- banknote -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></svg>
          現金
        </button>
        <button class="toggle-btn" id="btn-card" onclick="setPayment('card')">
          <!-- credit card -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="6" y1="15" x2="10" y2="15"/></svg>
          刷卡
        </button>
      </div>
    </div>
    <div class="field">
      <div class="field-label">
        <span>類別</span>
        <span class="field-link" onclick="openNewCat()">+ 新增類別</span>
      </div>
      <div class="chips" id="cat-chips"></div>
    </div>
    <div class="field">
      <div class="field-label">
        <span>子類別</span>
        <span class="field-link" onclick="openManageSubs()">管理子類別</span>
      </div>
      <div class="chips" id="sub-chips"></div>
    </div>
    <div class="field">
      <div class="field-label">金額（NT$）</div>
      <input type="number" id="inp-amount" placeholder="0" inputmode="numeric">
    </div>
    <div class="field">
      <div class="field-label">備註</div>
      <input type="text" id="inp-note" placeholder="記點什麼…">
    </div>
    <div class="field">
      <div class="field-label">日期</div>
      <input type="date" id="inp-date">
    </div>
    <button class="btn-save" id="btn-save" onclick="saveRecord()">記　錄</button>
  </div>

  <!-- Manage Subs -->
  <div id="manage-wrap" style="display:none">
    <div class="panel-header">
      <div class="rec-icon" id="manage-icon-circle" style="width:40px;height:40px"></div>
      <div>
        <div class="panel-sub">子類別管理</div>
        <div class="panel-name" id="manage-name"></div>
      </div>
    </div>
    <div class="sub-tags" id="sub-tags"></div>
    <div class="input-row">
      <input type="text" id="inp-newsub" placeholder="輸入子類別名稱…" onkeydown="if(event.key==='Enter')addSub()">
      <button class="btn-small" id="btn-addsub" onclick="addSub()">新增</button>
    </div>
    <button class="btn-back" onclick="closeManageSubs()">← 返回記帳</button>
  </div>

  <!-- Edit Category -->
  <div id="editcat-wrap" style="display:none">
    <div class="form-title" id="editcat-title">編輯類別</div>
    <div class="field">
      <div class="field-label">名稱</div>
      <input type="text" id="inp-catname" placeholder="類別名稱">
    </div>
    <div class="field">
      <div class="field-label">圖示</div>
      <div class="icon-grid" id="icon-grid"></div>
    </div>
    <div class="field">
      <div class="field-label">顏色</div>
      <div class="color-grid" id="color-grid"></div>
    </div>
    <div class="editcat-btns">
      <button class="btn-primary" onclick="saveCategory()">儲存</button>
      <button class="btn-danger" id="btn-delcat" onclick="deleteCategory()">刪除</button>
    </div>
    <button class="btn-back" style="margin-top:10px" onclick="closeEditCat()">取消</button>
  </div>
</div>

<script>
// ── SVG 圖示庫（細線條風格）────────────────────────────

// ── 工具 ─────────────────────────────────────────────
function getIcon(key, size=18, color="currentColor") {
  const svg = (ICONS[key] || ICONS.other)
    .replace('stroke="currentColor"', `stroke="${color}"`)
    .replace('viewBox', `width="${size}" height="${size}" viewBox`);
  return svg;
}
function escHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function today(){ return new Date().toISOString().slice(0,10); }

// ── Firebase 訂閱 ─────────────────────────────────────
db.ref("categories").on("value", snap => {
  const val = snap.val();
  if (val) {
    categories = Object.entries(val).map(([id,v]) => ({id,...v,subs:v.subs||[]}));
  } else {
    const obj={};
    DEFAULT_CATS.forEach(c=>{ obj[c.id]={label:c.label,iconKey:c.iconKey,color:c.color,subs:c.subs}; });
    db.ref("categories").set(obj);
  }
  if (!fCategory && fType==="expense" && categories.length>0) fCategory=categories[0].id;
  refreshAll();
});

db.ref("inc_categories").on("value", snap => {
  const val = snap.val();
  if (val) {
    incCategories = Object.entries(val).map(([id,v]) => ({id,...v,subs:v.subs||[]}));
  } else {
    const obj={};
    DEFAULT_INC_CATS.forEach(c=>{ obj[c.id]={label:c.label,iconKey:c.iconKey,color:c.color,subs:c.subs}; });
    db.ref("inc_categories").set(obj);
  }
  if (!fCategory && fType==="income" && incCategories.length>0) fCategory=incCategories[0].id;
  refreshAll();
});

db.ref("records").on("value", snap => {
  const val=snap.val()||{};
  records=Object.entries(val).map(([key,v])=>({_key:key,...v}));
  document.getElementById("loading").style.display="none";
  document.getElementById("dashboard").style.display="block";

  // 找最新一筆，顯示最後記帳資訊
  if(records.length>0){
    const latest=records.reduce((a,b)=>((b.timestamp||0)>(a.timestamp||0)?b:a), records[0]);
    const el=document.getElementById("header-last");
    if(el){
      if(latest.timestamp){
        const d=new Date(latest.timestamp);
        const mm=String(d.getMonth()+1).padStart(2,"0");
        const dd=String(d.getDate()).padStart(2,"0");
        const hh=String(d.getHours()).padStart(2,"0");
        const mi=String(d.getMinutes()).padStart(2,"0");
        const name=USERS[latest.user]?.label??latest.user??"";
        el.textContent=`最後記帳　${mm}/${dd} ${hh}:${mi}　${name}`;
      } else if(latest.date){
        // 舊資料沒有 timestamp，只顯示日期
        const d=new Date(latest.date);
        const mm=String(d.getMonth()+1).padStart(2,"0");
        const dd=String(d.getDate()).padStart(2,"0");
        const name=USERS[latest.user]?.label??latest.user??"";
        el.textContent=`最後記帳　${mm}/${dd}　${name}`;
      }
    }
  }

  refreshAll();
});

// ── 儲存 ──────────────────────────────────────────────
function saveRecord(){
  const amount=parseFloat(document.getElementById("inp-amount").value);
  if(!amount||isNaN(amount)){document.getElementById("inp-amount").focus();return;}
  const rec={user:fUser,category:fCategory,sub:fSub||"",amount,note:document.getElementById("inp-note").value.trim()||"－",date:document.getElementById("inp-date").value||today(),payment:fPayment,type:fType,timestamp:Date.now()};
  const btn=document.getElementById("btn-save");
  btn.textContent="✓ 已儲存"; btn.className="btn-save saved";

  if(editingKey){
    // 本地即時更新
    const idx=records.findIndex(r=>r._key===editingKey);
    if(idx>-1) records[idx]={...records[idx],...rec};
    db.ref("records/"+editingKey).update(rec);
  } else {
    // 本地即時插入（暫用臨時 key，Firebase 回傳後會被 onValue 替換）
    const tmpKey="_tmp_"+Date.now();
    records.unshift({_key:tmpKey,...rec});
    db.ref("records").push(rec);
  }

  updateLastHeader(fUser);
  lastSel[fType]={ category:fCategory, sub:fSub };

  // 立刻更新畫面
  const f=records.filter(r=>new Date(r.date).getMonth()===filterMonth);
  const total=f.reduce((s,r)=>s+(r.amount||0),0);

  setTimeout(()=>{
    resetForm();
    showView("dashboard");
    document.getElementById("total-amount").textContent="NT$ "+total.toLocaleString();
    renderPie(f); renderRecords(f);
  },600);
}

function startEdit(r){
  editingKey=r._key;
  fType=r.type||"expense";
  fUser=r.user||"me"; fPayment=r.payment||"cash";
  const cats=fType==="income"?incCategories:categories;
  fCategory=r.category||(cats[0]?.id??""); fSub=r.sub||"";
  document.getElementById("inp-amount").value=r.amount||"";
  document.getElementById("inp-note").value=r.note==="－"?"":(r.note||"");
  document.getElementById("inp-date").value=r.date||today();
  document.getElementById("form-title").textContent="編輯記錄";
  document.getElementById("btn-save").textContent="更　新";
  document.getElementById("btn-save").className="btn-save";
  renderFormUI(); showView("add");
}

}
function addSub(){
  const v=document.getElementById("inp-newsub").value.trim();if(!v)return;
  const dbPath=fType==="income"?"inc_categories":"categories";
  const cats=fType==="income"?incCategories:categories;
  const cat=cats.find(c=>c.id===fCategory);if(!cat)return;
  db.ref(`${dbPath}/${fCategory}`).update({subs:[...(cat.subs||[]),v]});
  document.getElementById("inp-newsub").value="";
}
function deleteSub(sub){
  const dbPath=fType==="income"?"inc_categories":"categories";
  const cats=fType==="income"?incCategories:categories;
  const cat=cats.find(c=>c.id===fCategory);if(!cat)return;
  db.ref(`${dbPath}/${fCategory}`).update({subs:(cat.subs||[]).filter(s=>s!==sub)});
}
function closeManageSubs(){showView("add");}

// ── 主類別編輯 ────────────────────────────────────────
function openEditCat(cat){
  editCatId=cat.id; newCatMode=false; ecType=fType;
  document.getElementById("editcat-title").textContent="編輯類別";
  document.getElementById("inp-catname").value=cat.label;
  document.getElementById("btn-delcat").style.display="block";
  ecIconKey=cat.iconKey||"other"; ecColor=cat.color;
  renderIconGrid();renderColorGrid();showView("editcat");
}
function openNewCat(){
  editCatId=null; newCatMode=true; ecType=fType;
  document.getElementById("editcat-title").textContent="新增類別";
  document.getElementById("inp-catname").value="";
  document.getElementById("btn-delcat").style.display="none";
  ecIconKey="other"; ecColor="#B0A898";
  renderIconGrid();renderColorGrid();showView("editcat");
}
function renderIconGrid(){
  const el=document.getElementById("icon-grid"); el.innerHTML="";
  ICON_KEYS.forEach(key=>{
    const btn=document.createElement("button");
    btn.className="icon-opt"+(ecIconKey===key?" sel":"");
    btn.innerHTML=getIcon(key,22,ecIconKey===key?ecColor:"#9E8E7E");
    btn.onclick=()=>{ecIconKey=key;renderIconGrid();};
    el.appendChild(btn);
  });
}
function renderColorGrid(){
  const el=document.getElementById("color-grid"); el.innerHTML="";
  CAT_COLORS.forEach(col=>{
    const div=document.createElement("div");
    div.className="color-opt"+(ecColor===col?" sel":"");
    div.style.background=col;
    div.onclick=()=>{ecColor=col;renderColorGrid();if(ecIconKey)renderIconGrid();};
    el.appendChild(div);
  });
}
async function saveCategory(){
  const label=document.getElementById("inp-catname").value.trim();
  if(!label){document.getElementById("inp-catname").focus();return;}
  if(newCatMode){
    const newId="cat_"+Date.now();
    const dbPath=ecType==="income"?"inc_categories":"categories";
    await db.ref(`${dbPath}/${newId}`).set({label,iconKey:ecIconKey,color:ecColor,subs:[]});
    fCategory=newId;
  } else {
    const dbPath=ecType==="income"?"inc_categories":"categories";
    await db.ref(`${dbPath}/${editCatId}`).update({label,iconKey:ecIconKey,color:ecColor});
  }
  closeEditCat();
}
async function deleteCategory(){
  if(!confirm("確定刪除此類別？（已記錄的資料不受影響）"))return;
  const dbPath=ecType==="income"?"inc_categories":"categories";
  await db.ref(`${dbPath}/${editCatId}`).remove();
  const cats=ecType==="income"?incCategories:categories;
  if(fCategory===editCatId) fCategory=cats[0]?.id??"";
  closeEditCat();
}
function closeEditCat(){showView("add");renderCatChips();}

// ── 主畫面渲染 ────────────────────────────────────────
function refreshAll(){
  if(view==="manage"){
    const cats=fType==="income"?incCategories:categories;
    const cat=cats.find(c=>c.id===fCategory);if(cat)renderSubTags(cat);return;
  }
  if(view!=="dashboard")return;
  const f=records.filter(r=>new Date(r.date).getMonth()===filterMonth);
  const incTotal=f.filter(r=>r.type==="income").reduce((s,r)=>s+(r.amount||0),0);
  const expTotal=f.filter(r=>r.type!=="income").reduce((s,r)=>s+(r.amount||0),0);
  document.getElementById("total-amount").textContent="NT$ "+(dashTab==="income"?incTotal:expTotal).toLocaleString();
  document.getElementById("total-income").textContent=incTotal.toLocaleString();
  document.getElementById("total-expense").textContent=expTotal.toLocaleString();
  // Tab 篩選
  const tabF=f.filter(r=>(dashTab==="income"?r.type==="income":r.type!=="income"));
  renderPie(tabF); renderRecords(tabF);
}

function renderPie(f){
  const cc=document.getElementById("chart-card"),ce=document.getElementById("chart-empty");
  if(f.length===0){cc.style.display="none";ce.style.display="block";return;}
  cc.style.display="block";ce.style.display="none";
  const allCats=[...categories,...incCategories];
  const map={};
  f.forEach(r=>{map[r.category]=(map[r.category]||0)+(r.amount||0);});
  const entries=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const labels=entries.map(([id])=>allCats.find(c=>c.id===id)?.label??id);
  const data=entries.map(([,v])=>v);
  const colors=entries.map(([id])=>allCats.find(c=>c.id===id)?.color??"#B0A898");
  if(pieChart){pieChart.destroy();pieChart=null;}
  pieChart=new Chart(document.getElementById("pieChart").getContext("2d"),{
    type:"doughnut",
    data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0,hoverOffset:6}]},
    options:{cutout:"58%",plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>" NT$ "+ctx.raw.toLocaleString()}}},animation:{duration:400}}
  });
  const leg=document.getElementById("chart-legend"); leg.innerHTML="";
  entries.forEach(([id,val])=>{
    const cat=categories.find(c=>c.id===id);
    const item=document.createElement("div"); item.className="legend-item";
    item.innerHTML=`<div class="legend-dot" style="background:${cat?.color??"#B0A898"}"></div><span class="legend-name">${escHtml(cat?.label??id)}</span><span class="legend-val">${val.toLocaleString()}</span>`;
    leg.appendChild(item);
  });
}

function renderRecords(f){
  const el=document.getElementById("records-inner"); el.innerHTML="";
  const sorted=[...f].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(sorted.length===0){el.innerHTML='<div class="empty">無記錄</div>';return;}
  sorted.forEach((r,i)=>{
    const allCats=[...categories,...incCategories];
    const cat=allCats.find(c=>c.id===r.category)??{iconKey:"other",label:r.category,color:"#B0A898"};
    const user=USERS[r.user]??{label:"?",color:"#B0A898"};
    const isIncome=r.type==="income";
    const d=new Date(r.date);
    const isFirst=i===0,isLast=i===sorted.length-1;
    const pos=isFirst&&isLast?"only":isFirst?"first":isLast?"last":"";

    const outer=document.createElement("div");
    outer.className="swipe-outer "+pos;

    // 底層按鈕
    const actions=document.createElement("div");
    actions.className="swipe-actions";
    actions.innerHTML=`
      <button class="swipe-btn edit" onclick="handleEdit('${r._key}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        編輯
      </button>
      <button class="swipe-btn delete" onclick="deleteRecord('${r._key}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        刪除
      </button>`;

    // 付款圖示
    const payIcon = r.payment==="cash"
      ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#B0A898" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>`
      : `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#B0A898" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="6" y1="15" x2="10" y2="15"/></svg>`;

    const inner=document.createElement("div");
    inner.className="swipe-inner";
    inner.innerHTML=`
      <div class="rec-icon" style="background:${cat.color}">${getIcon(cat.iconKey||"other",18,"#fff")}</div>
      <div class="rec-info">
        <div class="rec-cat">${escHtml(cat.label)}${r.sub?" · "+escHtml(r.sub):""}</div>
        <div class="rec-note-small">${escHtml(r.note==="－"?"":r.note)}</div>
        <div class="rec-meta">
          <span>${d.getMonth()+1}/${d.getDate()}</span>
          <span>·</span>${payIcon}
        </div>
      </div>
      <div class="rec-user" style="background:${user.color}18;color:${user.color}">${user.label}</div>
      <div class="rec-amount${isIncome?" income":""}">${isIncome?"+":""}${(r.amount||0).toLocaleString()}</div>`;

    // 滑動邏輯（RAF 優化，減少卡頓）
    let startX=null,startY=null,offset=0,rafId=null,locked=false;
    const THRESHOLD=80,MAX=140;
    inner.addEventListener("touchstart",e=>{
      startX=e.touches[0].clientX;
      startY=e.touches[0].clientY;
      locked=false;
      inner.style.transition="none";
    },{passive:true});
    inner.addEventListener("touchmove",e=>{
      if(startX===null)return;
      const dx=startX-e.touches[0].clientX;
      const dy=Math.abs(e.touches[0].clientY-startY);
      // 垂直滑動時不觸發水平
      if(!locked&&dy>dx){startX=null;return;}
      locked=true;
      if(dx>3){
        const target=Math.min(Math.max(dx,0),MAX);
        if(rafId)cancelAnimationFrame(rafId);
        rafId=requestAnimationFrame(()=>{
          offset=target;
          inner.style.transform=`translateX(-${offset}px)`;
        });
      }
    },{passive:true});
    inner.addEventListener("touchend",()=>{
      if(rafId)cancelAnimationFrame(rafId);
      inner.style.transition="transform .22s ease";
      offset=offset>THRESHOLD?MAX:0;
      inner.style.transform=offset?`translateX(-${MAX}px)`:"translateX(0)";
      startX=null;startY=null;locked=false;
    });

    outer.appendChild(actions); outer.appendChild(inner);
    el.appendChild(outer);
  });
}
</script>
