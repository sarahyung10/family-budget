<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<title>家庭記帳</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Josefin+Sans:wght@300;400;600;700&display=swap');
:root {
  --bg:#0A0A0F;
  --bg2:#111118;
  --card:rgba(255,255,255,.04);
  --card-solid:#13131C;
  --border:rgba(255,255,255,.08);
  --dark:#F0F2FF;
  --mid:#8A90B8;
  --light:#5A6080;
  --muted:#3A3D55;
  --pale:#2A2D45;
  --cyan:#00E5FF;
  --cyan2:#00B8D9;
  --purple:#A855F7;
  --purple2:#7C3AED;
  --blue:#3B82F6;
  --green:#10B981;
  --green2:#059669;
  --red:#F43F5E;
  --user-me:#00E5FF;
  --user-hu:#A855F7;
  --radius:18px;
  --radius-sm:12px;
  --glow-cyan:0 0 20px rgba(0,229,255,.25);
  --glow-purple:0 0 20px rgba(168,85,247,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Noto Sans TC','PingFang TC',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;min-height:-webkit-fill-available;overscroll-behavior:none}
body::before{content:'';position:fixed;top:-40%;left:-20%;width:60%;height:80%;background:radial-gradient(ellipse,rgba(168,85,247,.07) 0%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-30%;right:-10%;width:50%;height:60%;background:radial-gradient(ellipse,rgba(0,229,255,.05) 0%,transparent 70%);pointer-events:none;z-index:0}
::-webkit-scrollbar{width:2px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

#header{background:rgba(10,10,15,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:var(--dark);padding:52px 20px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
.header-title{font-size:20px;font-weight:700}
.header-last{font-size:10px;color:var(--light);margin-top:3px;letter-spacing:.3px}
.month-nav{display:flex;align-items:center;background:rgba(255,255,255,.05);border-radius:20px;padding:3px 6px;border:1px solid var(--border)}
.arr{cursor:pointer;user-select:none;padding:3px 8px;opacity:.5;font-size:18px;line-height:1;transition:all .2s;color:var(--cyan)}
.arr:hover,.arr:active{opacity:1}
#month-label{font-size:11px;font-weight:600;min-width:80px;text-align:center;color:var(--dark);letter-spacing:.5px}
.btn-add{background:linear-gradient(135deg,var(--purple2),var(--cyan2));color:#fff;border:none;border-radius:20px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;box-shadow:var(--glow-purple)}
.btn-add.cancel{background:rgba(255,255,255,.06);color:var(--mid);box-shadow:none;border:1px solid var(--border)}
.btn-add:active{transform:scale(.95)}

#main{max-width:480px;margin:0 auto;padding-bottom:80px;position:relative;z-index:1}

#total-card{background:linear-gradient(135deg,rgba(124,58,237,.2) 0%,rgba(0,184,217,.12) 100%);border:1px solid rgba(168,85,247,.25);border-radius:var(--radius);padding:24px 22px 20px;margin:16px 16px 0;position:relative;overflow:hidden;backdrop-filter:blur(12px)}
#total-card::before{content:'';position:absolute;top:-50px;right:-30px;width:140px;height:140px;background:radial-gradient(circle,rgba(168,85,247,.25),transparent 70%);pointer-events:none}
#total-card::after{content:'';position:absolute;bottom:-40px;left:10px;width:100px;height:100px;background:radial-gradient(circle,rgba(0,229,255,.15),transparent 70%);pointer-events:none}
#total-card .lbl{font-size:10px;font-weight:500;color:var(--mid);margin-bottom:10px;letter-spacing:1.5px;text-transform:uppercase}
#total-amount{font-size:38px;font-weight:700;background:linear-gradient(135deg,#fff 20%,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px;line-height:1}

.card{margin:12px 16px 0;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:20px 16px;backdrop-filter:blur(10px)}
.card-label{font-size:10px;font-weight:600;color:var(--mid);margin-bottom:14px;letter-spacing:1.5px;text-transform:uppercase}
#chart-wrap{position:relative;width:190px;height:190px;margin:0 auto}
#chart-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px}
.legend-item{display:flex;align-items:center;gap:7px}
.legend-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.legend-name{font-size:11px;color:var(--mid);font-weight:500}
.legend-val{font-size:11px;color:var(--dark);font-weight:600}
.empty-chart{padding:40px 0;text-align:center;color:var(--light);font-size:13px}

#records-list{margin:12px 16px 0}
.list-header{font-size:10px;font-weight:600;color:var(--light);margin-bottom:10px;letter-spacing:1.5px;text-transform:uppercase}
.hint{font-size:9px;opacity:.6;margin-left:6px;font-weight:400;text-transform:none;letter-spacing:0}
.empty{color:var(--light);font-size:13px;text-align:center;padding:32px 0}

.swipe-outer{position:relative;overflow:hidden;margin-bottom:6px;border-radius:var(--radius-sm)}
.swipe-actions{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:stretch}
.swipe-btn{width:72px;border:none;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.swipe-btn.edit{background:linear-gradient(135deg,var(--blue),var(--cyan2));border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.swipe-btn.delete{background:linear-gradient(135deg,#be123c,var(--red));border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.swipe-inner{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card-solid);border:1px solid var(--border);border-radius:var(--radius-sm);position:relative;z-index:1;transition:transform .25s ease;touch-action:pan-y;will-change:transform}

.rec-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rec-info{flex:1;min-width:0}
.rec-cat{font-size:13px;color:var(--dark);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rec-note-small{font-size:11px;color:var(--mid);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-meta{font-size:10px;color:var(--light);display:flex;align-items:center;gap:4px}
.rec-user{font-size:10px;font-weight:700;border-radius:6px;padding:2px 7px;flex-shrink:0;letter-spacing:.5px}
.rec-amount{font-size:15px;font-weight:700;color:var(--dark);flex-shrink:0;min-width:56px;text-align:right}
.rec-amount.income{background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

#form-wrap{margin:14px 16px;background:var(--card-solid);border-radius:var(--radius);border:1px solid var(--border);padding:22px 18px;animation:fadeIn .2s ease}
.form-title{font-size:10px;font-weight:600;color:var(--light);margin-bottom:0;letter-spacing:1.5px;text-transform:uppercase}
.field{margin-bottom:16px}
.field-label{font-size:10px;font-weight:600;color:var(--mid);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;user-select:none;letter-spacing:1px;text-transform:uppercase}
.field-link{font-size:10px;color:var(--cyan);font-weight:600;cursor:pointer;text-transform:none;letter-spacing:0}
.btn-row{display:flex;gap:8px}

.toggle-btn{flex:1;padding:10px 0;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--mid);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.toggle-btn.active-green{border-color:rgba(0,229,255,.5);background:rgba(0,229,255,.08);color:var(--cyan);box-shadow:var(--glow-cyan)}
.toggle-btn.active-green svg *{stroke:var(--cyan)}
.toggle-btn.active-brown{border-color:rgba(168,85,247,.5);background:rgba(168,85,247,.08);color:var(--purple);box-shadow:var(--glow-purple)}
.toggle-btn.active-brown svg *{stroke:var(--purple)}
.toggle-btn.active-blue{border-color:rgba(0,229,255,.4);background:rgba(0,229,255,.06);color:var(--cyan)}
.toggle-btn.active-blue svg *{stroke:var(--cyan)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.cat-chip-wrap{display:flex}
.cat-main-btn{padding:7px 8px 7px 10px;border-radius:20px 0 0 20px;border:1px solid var(--border);border-right:none;background:transparent;color:var(--mid);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.cat-edit-btn{padding:7px 8px;border-radius:0 20px 20px 0;border:1px solid var(--border);background:transparent;color:var(--light);font-family:inherit;font-size:11px;cursor:pointer;transition:all .15s;display:flex;align-items:center}
.cat-main-btn:active,.cat-edit-btn:active{opacity:.6}
.sub-chip{padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--mid);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}

input[type=text],input[type=number],input[type=date]{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:rgba(255,255,255,.03);font-family:inherit;font-size:14px;color:var(--dark);-webkit-appearance:none;appearance:none}
input[type=number]{font-size:26px;font-weight:700}
input:focus{outline:none;border-color:rgba(0,229,255,.35);box-shadow:0 0 0 3px rgba(0,229,255,.07)}

.btn-save{width:100%;padding:14px 0;border:none;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--purple2),var(--cyan2));color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;box-shadow:0 0 28px rgba(124,58,237,.35),0 0 56px rgba(0,184,217,.15);letter-spacing:.5px}
.btn-save.saved{background:linear-gradient(135deg,var(--green2),var(--green));box-shadow:0 0 24px rgba(16,185,129,.3)}
.btn-save:active{transform:scale(.98)}

#manage-wrap,#editcat-wrap{margin:14px 16px;background:var(--card-solid);border-radius:var(--radius);border:1px solid var(--border);padding:22px 18px;animation:fadeIn .2s ease}
.panel-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.panel-sub{font-size:10px;font-weight:600;color:var(--light);letter-spacing:1px;text-transform:uppercase}
.panel-name{font-size:16px;font-weight:700;color:var(--dark)}
.sub-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;min-height:36px}
.sub-tag{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 12px;border-radius:16px;font-size:12px;font-weight:500;border:1px solid var(--border);background:rgba(255,255,255,.03)}
.sub-tag-del{color:var(--light);cursor:pointer;font-size:15px;line-height:1;background:none;border:none;font-family:inherit;transition:color .15s}
.sub-tag-del:hover{color:var(--red)}
.input-row{display:flex;gap:8px;margin-bottom:16px}
.input-row input{flex:1;font-size:13px}
.btn-small{padding:10px 16px;border:none;border-radius:var(--radius-sm);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-back{width:100%;padding:12px 0;background:transparent;color:var(--mid);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer}

.icon-grid{display:flex;flex-wrap:wrap;gap:8px}
.icon-opt{width:46px;height:46px;border-radius:12px;cursor:pointer;transition:all .15s;background:rgba(255,255,255,.03);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px}
.icon-opt:hover{background:rgba(0,229,255,.07);border-color:rgba(0,229,255,.25)}
.icon-opt.sel{background:rgba(0,229,255,.1);border-color:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,.2)}
.color-grid{display:flex;flex-wrap:wrap;gap:10px}
.color-opt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s}
.color-opt:hover{transform:scale(1.2)}
.color-opt.sel{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.35)}
.editcat-btns{display:flex;gap:10px;margin-top:8px}
.btn-danger{padding:12px 16px;background:rgba(244,63,94,.08);color:var(--red);border:1px solid rgba(244,63,94,.25);border-radius:var(--radius-sm);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary{flex:1;padding:12px 0;background:linear-gradient(135deg,var(--purple2),var(--cyan2));color:#fff;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--glow-purple)}

.tab-bar{display:flex;margin:12px 16px 0;background:var(--card-solid);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;padding:4px;gap:4px}
.tab-btn{flex:1;padding:10px 0;border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:600;color:var(--mid);cursor:pointer;transition:all .2s;border-radius:12px;letter-spacing:.5px}
.tab-btn.active-exp{background:linear-gradient(135deg,var(--purple2),var(--blue));color:#fff;box-shadow:var(--glow-purple)}
.tab-btn.active-inc{background:linear-gradient(135deg,var(--green2),var(--cyan2));color:#fff;box-shadow:0 0 16px rgba(16,185,129,.3)}

.total-row{display:flex;gap:0;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07)}
.total-col{flex:1;text-align:center;position:relative}
.total-col+.total-col::before{content:'';position:absolute;left:0;top:10%;bottom:10%;width:1px;background:rgba(255,255,255,.07)}
.total-col-lbl{font-size:9px;color:var(--mid);margin-bottom:5px;font-weight:500;letter-spacing:1px;text-transform:uppercase}
.total-col-val{font-size:18px;font-weight:700;color:#fff}
.total-col-val.inc{background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.type-row{display:flex;gap:8px;margin-bottom:16px}
.type-btn{flex:1;padding:10px 0;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--mid);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px}
.type-btn.active-exp{border-color:rgba(168,85,247,.4);background:rgba(168,85,247,.08);color:var(--purple);box-shadow:0 0 12px rgba(168,85,247,.12)}
.type-btn.active-inc{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08);color:var(--green);box-shadow:0 0 12px rgba(16,185,129,.12)}

#loading{text-align:center;padding:60px 0;color:var(--light);font-size:13px;letter-spacing:1px}

@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@supports (padding-top:env(safe-area-inset-top)){
  #header{padding-top:max(52px,calc(env(safe-area-inset-top) + 14px))}
}
</style>
</head>
<body>

<div id="header">
  <div>
    <div class="header-title">
      <span style="font-family:'Josefin Sans',sans-serif;font-size:20px;font-weight:700;letter-spacing:3px;background:linear-gradient(135deg,#fff 20%,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase">Yu家記帳</span>
    </div>
    <div class="header-last" id="header-last"></div>
  </div>
  <div class="month-nav">
    <span class="arr" onclick="changeMonth(-1)">‹</span>
    <span id="month-label" onclick="openMonthPicker()" style="cursor:pointer;padding:4px 6px;border-radius:8px;transition:background .15s" onmouseover="this.style.background='rgba(108,99,255,.08)'" onmouseout="this.style.background='transparent'"></span>
    <span class="arr" onclick="changeMonth(1)">›</span>
  </div>
  <button class="btn-add" id="btn-add-top" onclick="toggleAdd()">+ 記帳</button>
</div>

<!-- Month Picker Modal -->
<div id="month-picker-overlay" onclick="closeMonthPicker()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;backdrop-filter:blur(8px)"></div>
<div id="month-picker" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.94);z-index:201;background:#13131C;border:1px solid rgba(0,229,255,.15);border-radius:20px;padding:24px 20px;width:320px;box-shadow:0 20px 60px rgba(0,0,0,.8),0 0 40px rgba(0,229,255,.1);transition:transform .2s ease,opacity .2s ease;opacity:0">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
    <button onclick="changePickerYear(-1)" style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 12px;font-size:18px;cursor:pointer;color:#00E5FF">‹</button>
    <span id="picker-year" style="font-size:17px;font-weight:700;color:#F0F2FF"></span>
    <button onclick="changePickerYear(1)" style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 12px;font-size:18px;cursor:pointer;color:#00E5FF">›</button>
  </div>
  <div id="picker-months" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"></div>
</div>

<!-- 身份設定彈窗（首次使用 / 點擊身份標籤） -->
<div id="identity-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;backdrop-filter:blur(10px)"></div>
<div id="identity-modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.92);z-index:301;background:#13131C;border:1px solid rgba(168,85,247,.25);border-radius:24px;padding:32px 24px;width:310px;box-shadow:0 20px 60px rgba(0,0,0,.8),0 0 60px rgba(168,85,247,.15);text-align:center;opacity:0;transition:all .25s ease">
  <div style="font-size:32px;margin-bottom:12px" id="identity-emoji">👋</div>
  <div style="font-size:18px;font-weight:700;color:#F0F2FF;margin-bottom:6px" id="identity-modal-title">你是誰？</div>
  <div style="font-size:13px;color:#6A7098;margin-bottom:20px" id="identity-modal-sub">選一次就好，之後自動帶入</div>

  <!-- 名稱輸入（改名模式時顯示） -->
  <div id="identity-rename-wrap" style="display:none;margin-bottom:16px">
    <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:8px;text-align:left">顯示名稱</div>
    <input id="identity-name-input" type="text" maxlength="6" placeholder="輸入你的名稱"
      style="width:100%;padding:11px 14px;border:1px solid rgba(255,255,255,.1);border-radius:10px;font-family:inherit;font-size:16px;font-weight:600;color:#F0F2FF;text-align:center;background:rgba(255,255,255,.04)">
  </div>

  <div style="display:flex;gap:12px">
    <button id="identity-btn-me" onclick="setIdentity('me')"
      style="flex:1;padding:16px 0;border-radius:14px;border:none;background:linear-gradient(135deg,#6C63FF,#4FA8E8);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(108,99,255,.35);transition:transform .15s"
      onmousedown="this.style.transform='scale(.96)'" onmouseup="this.style.transform='scale(1)'">淯</button>
    <button id="identity-btn-husband" onclick="setIdentity('husband')"
      style="flex:1;padding:16px 0;border-radius:14px;border:none;background:linear-gradient(135deg,#4FA8E8,#6C63FF);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(79,168,232,.35);transition:transform .15s"
      onmousedown="this.style.transform='scale(.96)'" onmouseup="this.style.transform='scale(1)'">達</button>
  </div>
  <button id="identity-cancel-btn" onclick="hideIdentityModal()" style="display:none;margin-top:14px;width:100%;padding:10px 0;background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:10px;font-family:inherit;font-size:13px;font-weight:500;color:#6A7098;cursor:pointer">取消</button>
</div>

<div id="main">
  <div id="loading">載入中…</div>

  <div id="dashboard" style="display:none">
    <div id="total-card">
      <div class="lbl" id="total-lbl">本月支出</div>
      <div id="total-amount">NT$ 0</div>
      <div class="total-row">
        <div class="total-col">
          <div class="total-col-lbl">收入</div>
          <div class="total-col-val inc" id="total-income">0</div>
        </div>
        <div class="total-col">

// ── Firebase 訂閱 ─────────────────────────────────────
db.ref("categories").on("value", snap => {
  const val = snap.val();
  if (val) {
    categories = Object.entries(val).map(([id,v]) => ({id,...v,subs:v.subs||[]}));
  } else {
    const obj={};
    DEFAULT_CATS.forEach(c=>{ obj[c.id]={label:c.label,iconKey:c.iconKey,color:c.color,subs:c.subs}; });
    db.ref("categories").set(obj);
  }
  if (!fCategory && fType==="expense" && categories.length>0) fCategory=categories[0].id;
  refreshAll();
});

db.ref("inc_categories").on("value", snap => {
  const val = snap.val();
  if (val) {
    incCategories = Object.entries(val).map(([id,v]) => ({id,...v,subs:v.subs||[]}));
  } else {
    const obj={};
    DEFAULT_INC_CATS.forEach(c=>{ obj[c.id]={label:c.label,iconKey:c.iconKey,color:c.color,subs:c.subs}; });
    db.ref("inc_categories").set(obj);
  }
  if (!fCategory && fType==="income" && incCategories.length>0) fCategory=incCategories[0].id;
  refreshAll();
});

db.ref("records").on("value", snap => {
  const val=snap.val()||{};
  records=Object.entries(val).map(([key,v])=>({_key:key,...v}));
  document.getElementById("loading").style.display="none";
  document.getElementById("dashboard").style.display="block";
  initIdentity();

  // 找最新一筆，顯示最後記帳資訊
  if(records.length>0){
    const latest=records.reduce((a,b)=>((b.timestamp||0)>(a.timestamp||0)?b:a), records[0]);
    const el=document.getElementById("header-last");
    if(el){
      if(latest.timestamp){
        const d=new Date(latest.timestamp);
        const mm=String(d.getMonth()+1).padStart(2,"0");
        const dd=String(d.getDate()).padStart(2,"0");
        const hh=String(d.getHours()).padStart(2,"0");
        const mi=String(d.getMinutes()).padStart(2,"0");
        const name=USERS[latest.user]?.label??latest.user??"";
        el.textContent=`最後記帳　${mm}/${dd} ${hh}:${mi}　${name}`;
      } else if(latest.date){
        // 舊資料沒有 timestamp，只顯示日期
        const d=new Date(latest.date);
        const mm=String(d.getMonth()+1).padStart(2,"0");
        const dd=String(d.getDate()).padStart(2,"0");
        const name=USERS[latest.user]?.label??latest.user??"";
        el.textContent=`最後記帳　${mm}/${dd}　${name}`;
      }
    }
  }

  refreshAll();
});

    showIdentityModal(false);
  } else {
    fUser = deviceUser;
    updateIdentityBadge();
  }

function showIdentityModal(renameMode){
  identityRenameMode = !!renameMode;
  USERS = getUsers();
  document.getElementById("identity-btn-me").textContent      = USERS.me.label;
  document.getElementById("identity-btn-husband").textContent = USERS.husband.label;
  if(renameMode){
    document.getElementById("identity-emoji").textContent         = "✏️";
    document.getElementById("identity-modal-title").textContent   = "設定名稱";
    document.getElementById("identity-modal-sub").textContent     = "選擇要修改的身份並輸入新名稱";
    document.getElementById("identity-rename-wrap").style.display = "block";
    document.getElementById("identity-cancel-btn").style.display  = "block";
    document.getElementById("identity-name-input").value = USERS[deviceUser]?.label ?? "";
  } else {
    document.getElementById("identity-emoji").textContent         = "👋";
    document.getElementById("identity-modal-title").textContent   = "你是誰？";
    document.getElementById("identity-modal-sub").textContent     = "選一次就好，之後自動帶入";
    document.getElementById("identity-rename-wrap").style.display = "none";
    document.getElementById("identity-cancel-btn").style.display  = "none";
  }
  const overlay = document.getElementById("identity-overlay");
  const modal   = document.getElementById("identity-modal");
  overlay.style.display = "block";
  modal.style.display   = "block";
  requestAnimationFrame(()=>{
    modal.style.transform = "translate(-50%,-50%) scale(1)";
    modal.style.opacity   = "1";
  });
  if(renameMode) setTimeout(()=>document.getElementById("identity-name-input").focus(), 280);
}

function hideIdentityModal(){
  const modal   = document.getElementById("identity-modal");
  const overlay = document.getElementById("identity-overlay");
  modal.style.transform = "translate(-50%,-50%) scale(.92)";
  modal.style.opacity   = "0";
  setTimeout(()=>{ modal.style.display="none"; overlay.style.display="none"; }, 220);
}

function setIdentity(user){
  if(identityRenameMode){
    const newName = document.getElementById("identity-name-input").value.trim();

  }
  deviceUser = user;
  localStorage.setItem("deviceUser", user);
  fUser = user;
  updateIdentityBadge();
  hideIdentityModal();
  refreshAll();
}

function openMonthPicker(){
  pickerYear = filterYear;
  renderPickerMonths();
  const overlay = document.getElementById("month-picker-overlay");
  const picker  = document.getElementById("month-picker");
  overlay.style.display = "block";
  picker.style.display  = "block";
  requestAnimationFrame(()=>{
    picker.style.transform = "translate(-50%,-50%) scale(1)";
    picker.style.opacity   = "1";
  });
}

function closeMonthPicker(){
  const picker  = document.getElementById("month-picker");
  const overlay = document.getElementById("month-picker-overlay");
  picker.style.transform = "translate(-50%,-50%) scale(.94)";
  picker.style.opacity   = "0";
  setTimeout(()=>{
    picker.style.display  = "none";
    overlay.style.display = "none";
  }, 180);
}

function changePickerYear(dir){
  pickerYear += dir;
  renderPickerMonths();
}

function renderPickerMonths(){
  document.getElementById("picker-year").textContent = pickerYear;
  const el = document.getElementById("picker-months");
  el.innerHTML = "";
  const now = new Date();
  MONTHS.forEach((m, i) => {
    const isActive  = i === filterMonth && pickerYear === filterYear;
    const isToday   = i === now.getMonth() && pickerYear === now.getFullYear();
    const btn = document.createElement("button");
    btn.textContent = m.replace("月","");
    btn.style.cssText = `
      padding:10px 0; border-radius:10px; border:none; font-family:inherit;
      font-size:13px; font-weight:600; cursor:pointer; transition:all .15s;
      background:${isActive?"linear-gradient(135deg,#7C3AED,#00B8D9)":isToday?"rgba(0,229,255,.07)":"rgba(255,255,255,.04)"};
      color:${isActive?"#fff":isToday?"#00E5FF":"#8A90B8"};
      box-shadow:${isActive?"0 3px 10px rgba(108,99,255,.3)":"none"};
      position:relative;
    `;
    if(isToday && !isActive){
      // 底部小點
      const dot = document.createElement("span");
      dot.style.cssText="position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#00E5FF;box-shadow:0 0 6px #00E5FF;display:block";
      btn.style.position="relative";
      btn.appendChild(dot);
    }
    btn.onclick = () => {
      filterMonth = i;
      filterYear  = pickerYear;
      updateMonthLabel();
      refreshAll();
      closeMonthPicker();
    };
    el.appendChild(btn);
  });
}

function renderCatChips(){
  const el=document.getElementById("cat-chips");
  el.innerHTML="";
  const cats=fType==="income"?incCategories:categories;
  cats.forEach(cat=>{
    const active=fCategory===cat.id;
    const wrap=document.createElement("div");
    wrap.className="cat-chip-wrap";
    const main=document.createElement("button");
    main.className="cat-main-btn";
    if(active){main.style.borderColor=cat.color;main.style.background=cat.color+"20";main.style.color=cat.color;}
    main.innerHTML=`<span style="display:inline-flex;opacity:.8">${getIcon(cat.iconKey||"other",14,active?cat.color:"#9E8E7E")}</span>${escHtml(cat.label)}`;
    main.onclick=()=>setCat(cat.id);
    const edit=document.createElement("button");
    edit.className="cat-edit-btn";
    if(active){edit.style.borderColor=cat.color;edit.style.background=cat.color+"20";edit.style.color=cat.color;}
    edit.innerHTML=`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="${active?cat.color:'#C8BEAF'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
    edit.onclick=()=>openEditCat(cat);
    wrap.appendChild(main); wrap.appendChild(edit);
    el.appendChild(wrap);
  });
}

function renderSubChips(){
  const el=document.getElementById("sub-chips");
  el.innerHTML="";
  const cats=fType==="income"?incCategories:categories;
  const cat=cats.find(c=>c.id===fCategory);

  const none=document.createElement("button");
  none.className="sub-chip";
  none.textContent="不指定";
  if(fSub===""){none.style.borderColor="#B0A898";none.style.background="#B0A89820";none.style.color="#7A6E65";}
  none.onclick=()=>setSub("");

  if(cat&&cat.subs&&cat.subs.length>0){
    cat.subs.forEach(s=>{
      const btn=document.createElement("button");
      btn.className="sub-chip";
      btn.textContent=s;
      if(fSub===s){btn.style.borderColor=cat.color;btn.style.background=cat.color+"18";btn.style.color=cat.color;}
      btn.onclick=()=>setSub(s);
      el.appendChild(btn);
    });
    el.appendChild(none);
  } else {
    el.appendChild(none);
    const hint=document.createElement("span");
    hint.style.cssText="font-size:11px;color:#C8BEAF;letter-spacing:1px;line-height:28px";
    hint.textContent="點右上「管理子類別」新增";
    el.appendChild(hint);
  }
}

function updateLastHeader(user){
  const el=document.getElementById("header-last");
  if(!el)return;
  const now=new Date();
  const mm=String(now.getMonth()+1).padStart(2,"0");
  const dd=String(now.getDate()).padStart(2,"0");
  const hh=String(now.getHours()).padStart(2,"0");
  const mi=String(now.getMinutes()).padStart(2,"0");
  const name=USERS[user]?.label??user;
  el.textContent=`最後記帳　${mm}/${dd} ${hh}:${mi}　${name}`;
}

// ── 儲存 ──────────────────────────────────────────────
function saveRecord(){
  const amount=parseFloat(document.getElementById("inp-amount").value);
  if(!amount||isNaN(amount)){document.getElementById("inp-amount").focus();return;}
  const rec={user:fUser,category:fCategory,sub:fSub||"",amount,note:document.getElementById("inp-note").value.trim()||"－",date:document.getElementById("inp-date").value||today(),payment:fPayment,type:fType,timestamp:Date.now()};
  const btn=document.getElementById("btn-save");
  btn.textContent="✓ 已儲存"; btn.className="btn-save saved";

  if(editingKey){
    // 本地即時更新
    const idx=records.findIndex(r=>r._key===editingKey);
    if(idx>-1) records[idx]={...records[idx],...rec};
    db.ref("records/"+editingKey).update(rec);
  } else {
    // 本地即時插入（暫用臨時 key，Firebase 回傳後會被 onValue 替換）
    const tmpKey="_tmp_"+Date.now();
    records.unshift({_key:tmpKey,...rec});
    db.ref("records").push(rec);
  }

  updateLastHeader(fUser);
  lastSel[fType]={ category:fCategory, sub:fSub };

  // 立刻更新畫面
  const f=records.filter(r=>new Date(r.date).getMonth()===filterMonth);
  const total=f.reduce((s,r)=>s+(r.amount||0),0);

  setTimeout(()=>{
    resetForm();
    showView("dashboard");
    document.getElementById("total-amount").textContent="NT$ "+total.toLocaleString();
    renderPie(f); renderRecords(f);
  },600);
}

function startEdit(r){
  editingKey=r._key;
  fType=r.type||"expense";
  fUser=r.user||"me"; fPayment=r.payment||"cash";
  const cats=fType==="income"?incCategories:categories;
  fCategory=r.category||(cats[0]?.id??""); fSub=r.sub||"";
  document.getElementById("inp-amount").value=r.amount||"";
  document.getElementById("inp-note").value=r.note==="－"?"":(r.note||"");
  document.getElementById("inp-date").value=r.date||today();
  document.getElementById("form-title").textContent="編輯記錄";
  document.getElementById("btn-save").textContent="更　新";
  document.getElementById("btn-save").className="btn-save";
  renderFormUI(); showView("add");
}
function deleteRecord(key){
  if(confirm("確定刪除這筆記錄？")) db.ref("records/"+key).remove();
}
function handleEdit(key){const r=records.find(r=>r._key===key);if(r)startEdit(r);}

function renderSubTags(cat){
  const el=document.getElementById("sub-tags"); el.innerHTML="";
  if(!cat.subs||cat.subs.length===0){el.innerHTML='<span style="color:#C8BEAF;font-size:12px;letter-spacing:1px">尚無子類別，請在下方新增</span>';return;}
  cat.subs.forEach(s=>{

    tag.className="sub-tag";
    tag.style.background=cat.color+"18"; tag.style.border="1px solid "+cat.color+"55";
    tag.innerHTML=`<span style="color:#3D3530">${escHtml(s)}</span><button class="sub-tag-del" onclick="deleteSub('${escHtml(s)}')">×</button>`;

function addSub(){
  const v=document.getElementById("inp-newsub").value.trim();if(!v)return;
  const dbPath=fType==="income"?"inc_categories":"categories";
  const cats=fType==="income"?incCategories:categories;
  const cat=cats.find(c=>c.id===fCategory);if(!cat)return;
  db.ref(`${dbPath}/${fCategory}`).update({subs:[...(cat.subs||[]),v]});
  document.getElementById("inp-newsub").value="";
}
function deleteSub(sub){
  const dbPath=fType==="income"?"inc_categories":"categories";
  const cats=fType==="income"?incCategories:categories;
  const cat=cats.find(c=>c.id===fCategory);if(!cat)return;
  db.ref(`${dbPath}/${fCategory}`).update({subs:(cat.subs||[]).filter(s=>s!==sub)});
}

async function saveCategory(){
  const label=document.getElementById("inp-catname").value.trim();
  if(!label){document.getElementById("inp-catname").focus();return;}
  if(newCatMode){
    const newId="cat_"+Date.now();
    const dbPath=ecType==="income"?"inc_categories":"categories";
    await db.ref(`${dbPath}/${newId}`).set({label,iconKey:ecIconKey,color:ecColor,subs:[]});
    fCategory=newId;
  } else {
    const dbPath=ecType==="income"?"inc_categories":"categories";
    await db.ref(`${dbPath}/${editCatId}`).update({label,iconKey:ecIconKey,color:ecColor});
  }
  closeEditCat();
}
async function deleteCategory(){
  if(!confirm("確定刪除此類別？（已記錄的資料不受影響）"))return;
  const dbPath=ecType==="income"?"inc_categories":"categories";
  await db.ref(`${dbPath}/${editCatId}`).remove();
  const cats=ecType==="income"?incCategories:categories;
  if(fCategory===editCatId) fCategory=cats[0]?.id??"";
  closeEditCat();
}
function closeEditCat(){showView("add");renderCatChips();}

// ── 主畫面渲染 ────────────────────────────────────────
function refreshAll(){
  if(view==="manage"){
    const cats=fType==="income"?incCategories:categories;
    const cat=cats.find(c=>c.id===fCategory);if(cat)renderSubTags(cat);return;
  }
  if(view!=="dashboard")return;
  const f=records.filter(r=>new Date(r.date).getMonth()===filterMonth);
  const incTotal=f.filter(r=>r.type==="income").reduce((s,r)=>s+(r.amount||0),0);
  const expTotal=f.filter(r=>r.type!=="income").reduce((s,r)=>s+(r.amount||0),0);
  document.getElementById("total-amount").textContent="NT$ "+(dashTab==="income"?incTotal:expTotal).toLocaleString();
  document.getElementById("total-income").textContent=incTotal.toLocaleString();
  document.getElementById("total-expense").textContent=expTotal.toLocaleString();
  // Tab 篩選
  const tabF=f.filter(r=>(dashTab==="income"?r.type==="income":r.type!=="income"));
  renderPie(tabF); renderRecords(tabF);
}

function renderPie(f){
  const cc=document.getElementById("chart-card"),ce=document.getElementById("chart-empty");
  if(f.length===0){cc.style.display="none";ce.style.display="block";return;}
  cc.style.display="block";ce.style.display="none";
  const allCats=[...categories,...incCategories];
  const map={};
  f.forEach(r=>{map[r.category]=(map[r.category]||0)+(r.amount||0);});
  const entries=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const labels=entries.map(([id])=>allCats.find(c=>c.id===id)?.label??id);
  const data=entries.map(([,v])=>v);
  const colors=entries.map(([id])=>allCats.find(c=>c.id===id)?.color??"#B0A898");
  if(pieChart){pieChart.destroy();pieChart=null;}
  pieChart=new Chart(document.getElementById("pieChart").getContext("2d"),{
    type:"doughnut",
    data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0,hoverOffset:6}]},
    options:{cutout:"62%",plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>" NT$ "+ctx.raw.toLocaleString()},bodyColor:"#F0F2FF",backgroundColor:"rgba(13,13,20,.95)",borderColor:"rgba(0,229,255,.2)",borderWidth:1,padding:10}},animation:{duration:500},elements:{arc:{borderWidth:0}}}
  });
  const leg=document.getElementById("chart-legend"); leg.innerHTML="";
  entries.forEach(([id,val])=>{
    const cat=categories.find(c=>c.id===id);
    const item=document.createElement("div"); item.className="legend-item";
    item.innerHTML=`<div class="legend-dot" style="background:${cat?.color??"#B0A898"}"></div><span class="legend-name">${escHtml(cat?.label??id)}</span><span class="legend-val">${val.toLocaleString()}</span>`;
    leg.appendChild(item);
  });
}

function renderRecords(f){
  const el=document.getElementById("records-inner"); el.innerHTML="";
  const sorted=[...f].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(sorted.length===0){el.innerHTML='<div class="empty">無記錄</div>';return;}
  sorted.forEach((r,i)=>{
    const allCats=[...categories,...incCategories];
    const cat=allCats.find(c=>c.id===r.category)??{iconKey:"other",label:r.category,color:"#B0A898"};
    const user=USERS[r.user]??{label:"?",color:"#B0A898"};
    const isIncome=r.type==="income";
    const d=new Date(r.date);
    const isFirst=i===0,isLast=i===sorted.length-1;
    const pos=isFirst&&isLast?"only":isFirst?"first":isLast?"last":"";

    const outer=document.createElement("div");
    outer.className="swipe-outer "+pos;

    // 底層按鈕
    const actions=document.createElement("div");
    actions.className="swipe-actions";
    actions.innerHTML=`
      <button class="swipe-btn edit" onclick="handleEdit('${r._key}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        編輯
      </button>
      <button class="swipe-btn delete" onclick="deleteRecord('${r._key}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        刪除
      </button>`;

    // 付款圖示
    const payIcon = r.payment==="cash"
      ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#B0A898" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>`
      : `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#B0A898" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="6" y1="15" x2="10" y2="15"/></svg>`;

    const inner=document.createElement("div");
    inner.className="swipe-inner";
    inner.innerHTML=`
      <div class="rec-icon" style="background:${cat.color}">${getIcon(cat.iconKey||"other",18,"#fff")}</div>
      <div class="rec-info">
        <div class="rec-cat">${escHtml(cat.label)}${r.sub?" · "+escHtml(r.sub):""}</div>
        <div class="rec-note-small">${escHtml(r.note==="－"?"":r.note)}</div>
        <div class="rec-meta">
          <span>${d.getMonth()+1}/${d.getDate()}</span>
          <span>·</span>${payIcon}
        </div>
      </div>
      <div class="rec-user" style="background:${user.color}18;color:${user.color}">${user.label}</div>
      <div class="rec-amount${isIncome?" income":""}">${isIncome?"+":""}${(r.amount||0).toLocaleString()}</div>`;

    // 滑動邏輯（RAF 優化，減少卡頓）
    let startX=null,startY=null,offset=0,rafId=null,locked=false;
    const THRESHOLD=80,MAX=140;
    inner.addEventListener("touchstart",e=>{
      startX=e.touches[0].clientX;
      startY=e.touches[0].clientY;
      locked=false;
      inner.style.transition="none";
    },{passive:true});
    inner.addEventListener("touchmove",e=>{
      if(startX===null)return;
      const dx=startX-e.touches[0].clientX;
      const dy=Math.abs(e.touches[0].clientY-startY);
      // 垂直滑動時不觸發水平
      if(!locked&&dy>dx){startX=null;return;}
      locked=true;
      if(dx>3){
        const target=Math.min(Math.max(dx,0),MAX);
        if(rafId)cancelAnimationFrame(rafId);
        rafId=requestAnimationFrame(()=>{
          offset=target;
          inner.style.transform=`translateX(-${offset}px)`;
        });
      }
    },{passive:true});
    inner.addEventListener("touchend",()=>{
      if(rafId)cancelAnimationFrame(rafId);
      inner.style.transition="transform .22s ease";
      offset=offset>THRESHOLD?MAX:0;
      inner.style.transform=offset?`translateX(-${MAX}px)`:"translateX(0)";
      startX=null;startY=null;locked=false;
    });

    outer.appendChild(actions); outer.appendChild(inner);
    el.appendChild(outer);
  });
}
</script>
</body>
</html>
